services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-central_office}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-central_office}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh-secret}
      ROOT_EMAIL: ${ROOT_EMAIL:-root@example.com}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-root-password}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
